name: samurai-meet-demo

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: samurai_meet_demo
      POSTGRES_USER: samurai_meet_app
      POSTGRES_PASSWORD: samurai_meet_password
    ports:
      - "5432:5432"
    volumes:
      - samurai_meet_demo_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U samurai_meet_app -d samurai_meet_demo"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_PASSWORD: samurai_meet_password
    ports:
      - "8080:8080"
    volumes:
      - samurai_meet_demo_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  samurai_meet_demo_postgres:
  samurai_meet_demo_storage:
